# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml – PiPNN SISAP 2026 Benchmark
#
# HOW TO BUILD:
#   docker compose build
#
# HOW TO RUN:
#   Edit the `command:` below to point at your dataset (or override it
#   inline), then:
#     docker compose run --rm pipnn-sisap
#
#   e.g. for a one-off dataset without editing the file:
#     docker compose run --rm pipnn-sisap \
#       --input /data/wikipedia-small/benchmark-dev-wikipedia-bge-m3-small.h5 \
#       --task-description /data/wikipedia-small/config.json \
#       --output /output
#
# HOW TO OVERRIDE HYPERPARAMETERS (no need to edit this file):
#   Create a ".env" file next to this one, e.g.:
#     BEAM_WIDTH=256
#     MEMORY_LIMIT_GB=20
#     HOST_MEMORY_LIMIT=24g
#   docker compose reads .env automatically.
#
# DATA LAYOUT EXPECTED:
#   ./data/<dataset-name>/<file>.h5   -> mounted read-only at /data/<dataset-name>/...
#   ./data/<dataset-name>/config.json
#   ./output/...                       -> mounted at /output (results.h5 lands here)
#
# This mirrors exactly what TIRA does at evaluation time — it substitutes
# $inputDataset (a directory with the .h5 + config.json) and $outputDir
# into the same --input/--task-description/--output flags. See the
# Dockerfile header for the full tira-cli code-submission example.
# ─────────────────────────────────────────────────────────────────────────────

services:
  pipnn-sisap:
    build: .
    image: pipnn-sisap
    container_name: pipnn-sisap

    volumes:
      - ./data:/data:ro
      - ./output:/output

    # Hard, Docker-enforced memory cap (OOM-killed if exceeded). Keep this
    # comfortably above MEMORY_LIMIT_GB below, which is a *soft* in-process
    # ulimit the container also applies so it can fail more gracefully.
    mem_limit: ${HOST_MEMORY_LIMIT:-24g}

    environment:
      # Query / retrieval
      BEAM_WIDTH: ${BEAM_WIDTH:-32}

      # Graph build parameters
      MAX_DEGREE: ${MAX_DEGREE:-32}
      ALPHA: ${ALPHA:-1.2}
      LEAF_SIZE: ${LEAF_SIZE:-512}
      MIN_LEAF_SIZE: ${MIN_LEAF_SIZE:-32}
      K_ENTRY: ${K_ENTRY:-12}
      ENTRY_SAMPLE: ${ENTRY_SAMPLE:-3000}
      HASH_BITS: ${HASH_BITS:-12}
      RESERVOIR_CAP: ${RESERVOIR_CAP:-32}
      NUM_REPLICAS: ${NUM_REPLICAS:-1}
      FINAL_PRUNE: ${FINAL_PRUNE:-0}
      BACK_EDGE: ${BACK_EDGE:-0}
      SEED: ${SEED:-42}
      RAND: ${RAND:-0}
      COOCKED: ${COOCKED:-0}
      ALLKNN_SAMPLE: ${ALLKNN_SAMPLE:-0}

      # Runtime / system
      NUM_THREADS: ${NUM_THREADS:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-0}
      MEMORY_LIMIT_GB: ${MEMORY_LIMIT_GB:-20}

    # Adjust the paths below to match whatever's under ./data. This is
    # exactly the command TIRA's --command template resolves to once
    # $inputDataset/$outputDir are substituted.
    # command:
    #   - --input
    #   - /data/wikipedia-small/benchmark-dev-wikipedia-bge-m3-small.h5
    #   - --task-description
    #   - /data/wikipedia-small/config.json
    #   - --output
    #   - /output
    
    command:
      - --input
      - /data/wikipedia/benchmark-dev-wikipedia-bge-m3.h5
      - --task-description
      - /data/wikipedia/config.json
      - --output
      - /output